name: Build Android APK
on:
  push:
    branches: [ "develop/artemis-transport" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Read package version
        shell: bash
        run: echo "ALEYON_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Install Android SDK 35 components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit, matrix, static, security and stub QA
        run: bash tests/run_core_tests.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aleyon-Bridge-v${{ env.ALEYON_VERSION }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
