name: Aleyon Bridge QA
on:
  push:
    branches: [ "develop/bridge-clean" ]
  pull_request:
  workflow_dispatch:

jobs:
  core-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Core, static, interaction and stub QA
        run: bash tests/run_core_tests.sh
