name: Aleyon Bridge QA
on:
  push:
  pull_request:
jobs:
  core-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run core/static/stub QA
        run: ./tests/run_core_tests.sh
