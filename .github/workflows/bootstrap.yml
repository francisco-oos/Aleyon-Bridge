name: Bootstrap Aleyon Bridge 0.4

on:
  push:
    branches: [ "main" ]
    paths:
      - "bootstrap/parts/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/parts/00 bootstrap/parts/01 bootstrap/parts/02 bootstrap/parts/03 bootstrap/parts/04 > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 85124
          base64 -d /tmp/source.b64 > /tmp/Aleyon-Bridge-0.4.0-alpha1-source.zip
          echo "bae9fcc09b10349433c367e998dc5bcbe88a72930939b2f6b8930cc3b40b62f5  /tmp/Aleyon-Bridge-0.4.0-alpha1-source.zip" | sha256sum -c -
          unzip -oq /tmp/Aleyon-Bridge-0.4.0-alpha1-source.zip -d .

      - name: Verify exact snapshot and local QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          errors = []
          rows = [x for x in Path('MANIFEST_SHA256.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          for row in rows:
              expected, rel = row.split('  ', 1)
              p = root / rel
              if not p.is_file():
                  errors.append(f'missing: {rel}')
                  continue
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != expected:
                  errors.append(f'hash mismatch: {rel}')
          print(f'manifest entries={len(rows)} errors={len(errors)}')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY
          bash tests/run_core_tests.sh

      - name: Publish source without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN can write repository content but cannot mutate workflow files.
          # Restore workflows from HEAD; they are updated separately through the GitHub connector.
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Aleyon Bridge 0.4.0-alpha1 source"
          git push origin HEAD:main
