<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aleyon Bridge</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#182033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:760px;margin:auto}.hero{padding:22px 0 14px}.hero h1{margin:0;font-size:30px}.muted{color:#69748a}.card{background:#fff;border:1px solid #e2e7f0;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 6px 22px #1d2b4a0b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}.pill{font-size:12px;padding:5px 9px;background:#eef3ff;border-radius:999px;color:#3158a9}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;background:#2957c8;color:#fff}.btn.secondary{background:#edf1f8;color:#24324d}.btn.danger{background:#fff0f0;color:#a42c2c}.btn:disabled{opacity:.5}input,select,textarea{width:100%;border:1px solid #d9dfeb;border-radius:12px;padding:12px;margin:6px 0 12px;background:#fff;font:inherit}textarea{min-height:74px}label{font-size:13px;font-weight:700;color:#536079}.hidden{display:none}.status{padding:12px;border-radius:14px;background:#f2f5fb;margin:12px 0}.top-actions{display:flex;gap:8px}.small{font-size:13px}.memory{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;max-height:240px;overflow:auto;background:#f7f9fc;padding:12px;border-radius:12px}.notice{background:#fff8df;border:1px solid #f3dea0;padding:12px;border-radius:14px}
</style></head><body>
<div class="hero"><div class="row"><div class="grow"><h1>Aleyon Bridge</h1><div class="muted">Tu perfil y progreso viven en Aleyon. Gemini aporta Chat, Live y capacidades multimodales.</div></div><button class="btn secondary" onclick="openSettings()">Accesibilidad</button></div></div>
<div id="home"><div id="env"></div><div id="profiles"></div><button class="btn" onclick="newProfile()">+ Aprender otro idioma</button></div>
<div id="form" class="hidden card"><h2 id="formTitle">Perfil</h2><input id="pid" type="hidden"><label>Idioma objetivo</label><input id="targetLang" placeholder="Inglés"><label>Idioma de apoyo</label><input id="nativeLang" placeholder="Español"><label>Propósito principal</label><input id="goal" placeholder="Conversar con fluidez, trabajo, viaje…"><label>Nivel aproximado</label><input id="level" placeholder="Por estimar / A2 / B1…"><label>Estilo de corrección</label><select id="correction"><option value="suave">Suave</option><option value="directa">Directa</option><option value="intensiva">Intensiva</option></select><label>Ocupación / contexto</label><input id="career" placeholder="Opcional"><label>Intereses</label><input id="interests" placeholder="Opcional"><label>Situaciones prioritarias</label><input id="situations" placeholder="Opcional"><label>Contexto adicional / especialización</label><textarea id="extra"></textarea><div class="row"><button class="btn" onclick="saveProfile()">Guardar</button><button class="btn secondary" onclick="showHome()">Cancelar</button></div></div>
<div id="detail" class="hidden card"><div id="detailBody"></div><div class="row"><button class="btn secondary" onclick="showHome()">Volver</button></div></div>
<script>
const native=()=>typeof AndroidBridge!=="undefined";let profiles=[];let poll=null;
function norm(s){return (s||"").trim()}function esc(s){return String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function title(s){s=norm(s);return s?s[0].toUpperCase()+s.slice(1):"Idioma"}function chatName(label){return `ALEYON LIVE — ${title(label)} — Conversación principal`}
function load(){try{profiles=JSON.parse(AndroidBridge.getNativeProfilesJson()||"[]")}catch(e){profiles=[]}render()}
function env(){let html="";if(!native())html='<div class="notice">Abre esta pantalla desde la APK Android.</div>';else if(!AndroidBridge.isGeminiInstalled())html='<div class="notice">Gemini no está instalado.</div>';else if(!AndroidBridge.isAutomationEnabled())html='<div class="notice">Activa el servicio de Accesibilidad de Aleyon Bridge para automatizar Gemini. <button class="btn secondary" onclick="openSettings()">Abrir ajustes</button></div>';document.getElementById("env").innerHTML=html}
function render(){env();let out="";for(const p of profiles){let st={};try{st=JSON.parse(AndroidBridge.getProfileStatus(p.id)||"{}")}catch(e){};let stage=st.stage||"READY";out+=`<div class="card"><div class="row"><div class="grow"><b>${esc(title(p.label||p.targetLang))}</b><div class="small muted">${esc(p.targetLang)} · ${esc(p.level||"nivel por estimar")}</div></div><span class="pill">${esc(stage)}</span></div>${st.lastError?`<div class="notice small">${esc(st.lastError)}</div>`:""}<div class="row" style="margin-top:14px"><button class="btn" onclick="startLive('${p.id}')">Live</button><button class="btn secondary" onclick="startChat('${p.id}')">Chat</button><button class="btn secondary" onclick="editProfile('${p.id}')">Editar</button><button class="btn secondary" onclick="showMemory('${p.id}')">Progreso</button></div></div>`}document.getElementById("profiles").innerHTML=out||'<div class="card muted">Aún no hay perfiles. Crear uno sólo guarda datos localmente; Gemini se prepara al iniciar la primera sesión.</div>'}
function show(id){for(const x of ["home","form","detail"])document.getElementById(x).classList.toggle("hidden",x!==id)}function showHome(){show("home");load()}
function newProfile(){document.getElementById("formTitle").textContent="Nuevo perfil";document.getElementById("targetLang").disabled=false;for(const id of ["pid","targetLang","nativeLang","goal","level","career","interests","situations","extra"])document.getElementById(id).value="";document.getElementById("correction").value="suave";show("form")}
function editProfile(id){let p=profiles.find(x=>x.id===id);if(!p)return;document.getElementById("formTitle").textContent="Editar "+title(p.label);document.getElementById("targetLang").disabled=true;document.getElementById("pid").value=p.id;document.getElementById("targetLang").value=p.targetLang||p.label||"";document.getElementById("nativeLang").value=p.nativeLang||"";document.getElementById("goal").value=p.goal||"";document.getElementById("level").value=p.level||"";document.getElementById("correction").value=p.correction||"suave";document.getElementById("career").value=p.career||"";document.getElementById("interests").value=p.interests||"";document.getElementById("situations").value=p.situations||"";document.getElementById("extra").value=p.extra||"";show("form")}
function saveProfile(){let target=norm(document.getElementById("targetLang").value),nativeLang=norm(document.getElementById("nativeLang").value),goal=norm(document.getElementById("goal").value);if(!target||!nativeLang||!goal){alert("Idioma objetivo, idioma de apoyo y propósito son necesarios.");return}let existingId=norm(document.getElementById("pid").value),old=profiles.find(x=>x.id===existingId);let id=old?old.id:"";let p={id,label:title(target),targetLang:target,nativeLang,goal,level:norm(document.getElementById("level").value),correction:document.getElementById("correction").value,career:norm(document.getElementById("career").value),interests:norm(document.getElementById("interests").value),situations:norm(document.getElementById("situations").value),extra:norm(document.getElementById("extra").value),chatName:old&&old.chatName?old.chatName:chatName(target),managedByBridge:true,detectedOnly:false,sessions:old&&old.sessions||0};if(!AndroidBridge.saveProfileLocal(JSON.stringify(p))){alert("No pude guardar el perfil.");return}showHome()}
function byId(id){return profiles.find(x=>x.id===id)}function preflight(){if(!native())return false;if(!AndroidBridge.isAutomationEnabled()){openSettings();return false}if(!AndroidBridge.isGeminiInstalled()){alert("Instala Gemini para usar Bridge.");return false}return true}
function startLive(id){if(!preflight())return;let p=byId(id);if(!p)return;if(!AndroidBridge.startLiveSession(JSON.stringify(p)))alert("No pude iniciar el servicio de automatización.");else watch(id)}
function startChat(id){if(!preflight())return;let p=byId(id);if(!p)return;if(!AndroidBridge.startChatSession(JSON.stringify(p)))alert("No pude iniciar el servicio de automatización.");else watch(id)}
function watch(id){clearInterval(poll);poll=setInterval(()=>{let s={};try{s=JSON.parse(AndroidBridge.getProfileStatus(id)||"{}")}catch(e){};if(["READY","AMBIGUOUS_USER_REQUIRED","USER_ACTION_REQUIRED","APP_UPDATE_REQUIRED","ERROR"].includes(s.stage)){clearInterval(poll);load()}},1200)}
function showMemory(id){let p=byId(id);if(!p)return;let raw=AndroidBridge.getProfileMemory(id)||"{}",o={};try{o=JSON.parse(raw)}catch(e){};let events=(o.events||[]).slice(-8).map(e=>`• ${esc(e.category)} / ${esc(e.skill)} [${esc(e.status)}]: ${esc(e.evidence)}`).join("<br>");document.getElementById("detailBody").innerHTML=`<h2>${esc(title(p.label))}</h2><p><b>Última sesión</b><br>${esc(o.summary||"Todavía sin resumen confirmado.")}</p><p><b>Próximo objetivo</b><br>${esc(o.next||"Se definirá con evidencia de sesión.")}</p>${o.lastFeedback?`<p><b>Consejo</b><br>${esc(o.lastFeedback)}</p>`:""}<p><b>Evidencia reciente</b><br>${events||"Sin eventos verificados todavía."}</p><div class="row"><button class="btn secondary" onclick="editProfile('${id}')">Editar perfil</button><button class="btn danger" onclick="removeProfile('${id}')">Quitar perfil local</button></div>`;show("detail")}
function removeProfile(id){let p=byId(id);if(!p||!confirm(`Quitar ${p.label} de Aleyon? El chat de Gemini no se borrará.`))return;AndroidBridge.removeNativeLocalProfile(id);showHome()}
function openSettings(){if(native())AndroidBridge.openAutomationSettings()}window.onAleyonResume=()=>load();load();
</script></body></html>
